  <section class="page-hero">
    <div class="wrap">
      <span class="eyebrow">Contact</span>
      <h1>次の物語を待つ建物はありませんか。</h1>
      <p class="lede">個性ある建物に、事業として持続可能な新しい用途を求めるオーナーやパートナーの皆さまと協働しています。</p>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="wrap split split--top">
      <div>
        <h2>ご相談を始める。</h2>
        <p>物件、場所、または事業機会についてお聞かせください。</p>

        <form class="form" action="#" method="post" style="margin-top:40px">
          <div>
            <label id="type-label">ご所属・お立場</label>
            <div class="chips" role="radiogroup" aria-labelledby="type-label">
              <input type="radio" name="type" id="t-owner" value="Property Owner"><label for="t-owner">不動産オーナー</label>
              <input type="radio" name="type" id="t-dev" value="Developer / Investor"><label for="t-dev">開発事業者・投資家</label>
              <input type="radio" name="type" id="t-hosp" value="Hospitality Partner"><label for="t-hosp">ホスピタリティパートナー</label>
              <input type="radio" name="type" id="t-arch" value="Architect / Consultant"><label for="t-arch">建築家・コンサルタント</label>
              <input type="radio" name="type" id="t-muni" value="Municipality / Regional Organisation"><label for="t-muni">自治体・地域団体</label>
              <input type="radio" name="type" id="t-media" value="Media"><label for="t-media">報道関係</label>
              <input type="radio" name="type" id="t-team" value="Prospective Team Member"><label for="t-team">採用希望</label>
              <input type="radio" name="type" id="t-other" value="Other"><label for="t-other">その他</label>
            </div>
          </div>
          <div class="form__row">
            <div><label for="name">お名前</label><input id="name" name="name" type="text" autocomplete="name" required></div>
            <div><label for="org">会社・団体名</label><input id="org" name="organisation" type="text" autocomplete="organization"></div>
          </div>
          <div class="form__row">
            <div><label for="email">メールアドレス</label><input id="email" name="email" type="email" autocomplete="email" required></div>
            <div><label for="country">国・地域</label><input id="country" name="country" type="text" autocomplete="country-name"></div>
          </div>
          <div><label for="msg">ご相談内容</label><textarea id="msg" name="message" required></textarea></div>
          <div><button type="submit" class="btn btn--solid" style="cursor:pointer;font-family:inherit">送信する</button></div>
        </form>
      </div>

      <div class="contact-block">
        <div class="ph ph--tall ph--timber" data-img="contact-threshold" data-label="Photo — doorway / threshold detail" style="margin-bottom:40px"></div>
        <h4>Singapore</h4>
        <p>Conservation Dwelling Pte Ltd</p>
        <p>シンガポール</p>
        <p>cdwelling.com</p>

        <p>[business email]</p>
        <h4>パートナーシップ</h4>
        <p>[business development email]</p>
      </div>
    </div>
  </section>
