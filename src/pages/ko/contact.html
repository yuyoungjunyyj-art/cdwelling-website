  <section class="page-hero">
    <div class="wrap">
      <span class="eyebrow">Contact</span>
      <h1>다음 이야기를 기다리는 건물이 있으신가요?</h1>
      <p class="lede">개성 있는 건물에 상업적으로 지속 가능한 새로운 쓰임을 찾는 소유주, 파트너와 함께 일합니다.</p>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="wrap split split--top">
      <div>
        <h2>대화를 시작하세요.</h2>
        <p>건물, 장소, 혹은 사업 기회에 대해 알려주십시오.</p>

        <form class="form" action="#" method="post" style="margin-top:40px">
          <div>
            <label id="type-label">문의자 유형</label>
            <div class="chips" role="radiogroup" aria-labelledby="type-label">
              <input type="radio" name="type" id="t-owner" value="Property Owner"><label for="t-owner">부동산 소유주</label>
              <input type="radio" name="type" id="t-dev" value="Developer / Investor"><label for="t-dev">개발사·투자자</label>
              <input type="radio" name="type" id="t-hosp" value="Hospitality Partner"><label for="t-hosp">호스피탈리티 파트너</label>
              <input type="radio" name="type" id="t-arch" value="Architect / Consultant"><label for="t-arch">건축가·컨설턴트</label>
              <input type="radio" name="type" id="t-muni" value="Municipality / Regional Organisation"><label for="t-muni">지자체·지역 기관</label>
              <input type="radio" name="type" id="t-media" value="Media"><label for="t-media">언론</label>
              <input type="radio" name="type" id="t-team" value="Prospective Team Member"><label for="t-team">입사 희망자</label>
              <input type="radio" name="type" id="t-other" value="Other"><label for="t-other">기타</label>
            </div>
          </div>
          <div class="form__row">
            <div><label for="name">이름</label><input id="name" name="name" type="text" autocomplete="name" required></div>
            <div><label for="org">소속</label><input id="org" name="organisation" type="text" autocomplete="organization"></div>
          </div>
          <div class="form__row">
            <div><label for="email">이메일</label><input id="email" name="email" type="email" autocomplete="email" required></div>
            <div><label for="country">국가</label><input id="country" name="country" type="text" autocomplete="country-name"></div>
          </div>
          <div><label for="msg">문의 내용</label><textarea id="msg" name="message" required></textarea></div>
          <div><button type="submit" class="btn btn--solid" style="cursor:pointer;font-family:inherit">문의 보내기</button></div>
        </form>
      </div>

      <div class="contact-block">
        <div class="ph ph--tall ph--timber" data-img="contact-threshold" data-label="Photo — doorway / threshold detail" style="margin-bottom:40px"></div>
        <h4>Singapore</h4>
        <p>Conservation Dwelling Pte Ltd</p>
        <p>싱가포르</p>
        <p>cdwelling.com</p>
        <h4>일반 문의</h4>
        <p>[business email]</p>
        <h4>파트너십 문의</h4>
        <p>[business development email]</p>
      </div>
    </div>
  </section>
